services:
  execution-service:
    build: .
    ports:
      - "5012:8080"
    environment:
      - ConnectionStrings__ExecutionDatabase=mongodb://mongo:27017/ExecutionServiceDb
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
      - Messaging__UseStub=false
      - ASPNETCORE_ENVIRONMENT=Development
      - DD_SERVICE=execution-service
      - DD_ENV=local
      - DD_VERSION=1.0.0
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_API_KEY=${DD_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
